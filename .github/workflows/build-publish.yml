name: build-publish

# Every push to main builds the app image and publishes it to GHCR.
# This is what makes the Portainer stack updatable via GitHub:
#   push code here -> image lands in ghcr.io/likelyabot/fishing-app
#   -> "Update the stack" in Portainer pulls it (pull_policy: always).
#
# Auth: the built-in GITHUB_TOKEN with packages:write (declared below).
# The GHCR package is auto-created on first push. No PATs involved.

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # :latest = rolling edge for the stack; immutable SHA tag =
          # pin/rollback handle (set FISHING_APP_IMAGE to a SHA to roll back).
          tags: |
            ghcr.io/${{ github.repository_owner }}/fishing-app:latest
            ghcr.io/${{ github.repository_owner }}/fishing-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
